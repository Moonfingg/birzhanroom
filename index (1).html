.on .scr::before,.tvon .scr::before,.glitch .scr::before{opacity:0}
/* window */
.win-w{left:18%;top:11%;width:clamp(150px,14vw,250px);height:36vh;border:9px solid #6b4a2c;background:
 radial-gradient(2px 2px at 20% 25%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 15%,#fff,transparent),radial-gradient(2px 2px at 55% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 75%,#fff,transparent),
 linear-gradient(180deg,#0a1634,#1b3263)}
.win-w::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#6b4a2c}
.win-w::after{content:"";position:absolute;top:50%;left:0;right:0;height:6px;margin-top:-3px;background:#6b4a2c}
.moon{position:absolute;right:16%;top:12%;width:26px;height:26px;border-radius:50%;background:#f4efd2;box-shadow:0 0 18px #f4efd2,inset -6px -3px 0 #cfc9a3}
.cur{position:absolute;top:-14px;bottom:-6px;width:30%;background:repeating-linear-gradient(90deg,#6b1f2a 0 8px,#561720 8px 16px)}
.cur.l{left:-18%}.cur.r{right:-18%}
.rod{position:absolute;left:-22%;right:-22%;top:-18px;height:6px;background:#2a1a0c;border-radius:3px}
/* clock */
.clock{left:46%;top:47%;width:clamp(48px,6vw,90px);aspect-ratio:1;border-radius:50%;background:#efe3c4;border:5px solid #3a2412;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.clock i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#2a1a0c;border-radius:2px}
.clock .h{width:3px;height:22%;transform:rotate(300deg)}.clock .m{width:2px;height:32%;transform:rotate(60deg)}
.clock .s{width:1px;height:36%;background:#b3261e;animation:sec 60s steps(60) infinite}@keyframes sec{to{transform:rotate(360deg)}}
.rug{left:25%;bottom:2%;width:36vw;height:11vh;border-radius:50%;background:repeating-radial-gradient(ellipse at center,#7a2f2a 0 14px,#a8553d 14px 22px,#e0c08a 22px 26px);box-shadow:0 0 0 4px #3a1a14}
.sofa{left:30%;bottom:13%;width:26vw}.plant{left:63%;bottom:12%;height:30vh}.shelf{right:3vw;bottom:13%;height:32vh}
.sofa,.plant,.shelf{overflow:visible}
@media (max-width:700px){
 .win-w,.clock,.sofa,.shelf,.rug,.plant,.beam,.wlight,.cat{display:none}
 .content{left:4vw;right:4vw;width:auto;top:calc(env(safe-area-inset-top,0px) + 15%);gap:8px}.ico{display:none}.v{font-size:18px}
 .pic{left:auto;right:6vw;top:44%;width:34vw}.tv{left:auto;right:4vw;bottom:11%;width:38vw}
 .tiles{max-height:110px}.lamp{height:62vh}.hint{display:none}
}

<script>
const arrow='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10M7 17 17 7"/></svg>';
const icons={folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
 link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
 box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16ZM3.3 7 12 12l8.7-5M12 22V12"/>'};
const stats=[
 {title:'Файлы',value:'24',change:12,icon:'folder',gradient:'linear-gradient(135deg,#f59e0b,#ef4444)'},
 {title:'Ссылки',value:'18',change:8,icon:'link',gradient:'linear-gradient(135deg,#6366f1,#06b6d4)'},
 {title:'Проекты',value:'6',change:25,icon:'box',gradient:'linear-gradient(135deg,#10b981,#84cc16)'}];
document.getElementById('cards').innerHTML=stats.map(s=>`<div class="win"><div class="glass-card" data-k="${s.icon}" data-t="${s.title}" tabindex="0" role="button"><div class="dots"><i></i><i></i><i></i></div><div class="row"><div><p class="t">${s.title}</p><h2 class="v" data-k="${s.icon}">0</h2><p class="ch">Открыть ${arrow}</p></div><div class="ico" style="background:${s.gradient}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[s.icon]}</svg></div></div></div></div>`).join('');

/* ---- звук (Web Audio) ---- */
let ctx,hum;
function audio(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}return ctx}
function noise(d,f,v){const n=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
 const s=ctx.createBufferSource();s.buffer=b;const q=ctx.createBiquadFilter();q.type='bandpass';q.frequency.value=f;q.Q.value=1.2;const g=ctx.createGain();g.gain.value=v;s.connect(q);q.connect(g);g.connect(ctx.destination);s.start()}
function tone(f,d,v,type='sine',w=0){const t=ctx.currentTime+w,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02)}
function soundOn(){if(!audio())return;noise(.05,3500,.7);tone(150,.07,.5,'square');tone(2300,.25,.05,'sine',.06);
 const t=ctx.currentTime,o1=ctx.createOscillator(),o2=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
 o1.type='sawtooth';o1.frequency.value=100;o2.type='sine';o2.frequency.value=200;lp.type='lowpass';lp.frequency.value=380;g.gain.setValueAtTime(0,t);
 [0,.09,.12,.2].forEach((x,i)=>g.gain.linearRampToValueAtTime(i%2?.005:.035,t+.05+x));g.gain.linearRampToValueAtTime(.014,t+.6);
 o1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(ctx.destination);o1.start();o2.start();hum={o1,o2,g}}
function soundOff(){if(!audio())return;noise(.06,2200,.6);tone(100,.09,.5,'square');
 if(hum){const t=ctx.currentTime,h=hum;h.g.gain.cancelScheduledValues(t);h.g.gain.setValueAtTime(h.g.gain.value,t);h.g.gain.linearRampToValueAtTime(0,t+.12);h.o1.stop(t+.15);h.o2.stop(t+.15);hum=null}}

/* ---- свет ---- */
const scene=document.getElementById('scene'),lampEl=document.getElementById('lamp'),knob=document.getElementById('knob');
const TOP=338,H=102;let lit=false,pos=0,timers=[];
function place(){const r=document.getElementById('bulb').getBoundingClientRect();scene.style.setProperty('--lx',(r.left+r.width/2)+'px');scene.style.setProperty('--ly',(r.top+r.height/2)+'px')}
addEventListener('resize',place);place();
function setPos(p){knob.style.setProperty('--pull',(p*60)+'px')}
function setLit(v){
 if(v===lit)return;lit=v;timers.forEach(clearTimeout);timers=[];
 if(v){soundOn();place();scene.classList.add('on');timers.push(setTimeout(()=>scene.classList.remove('on'),90),setTimeout(()=>scene.classList.add('on'),170))}
 else{soundOff();scene.classList.remove('on')}
}
/* ---- ползунок на лампе ---- */
let drag=false,sy=0,moved=0;
function geom(){const r=lampEl.getBoundingClientRect(),k=r.height/700;return{y0:r.top+TOP*k,h:H*k}}
knob.addEventListener('pointerdown',e=>{audio();drag=true;moved=0;sy=e.clientY;knob.classList.add('drag');knob.setPointerCapture(e.pointerId)});
knob.addEventListener('pointermove',e=>{if(!drag)return;const dy=Math.max(0,Math.min(60,e.clientY-sy));moved=Math.max(moved,dy);pos=dy/60;
 setPos(pos)});
function end(){if(!drag)return;drag=false;knob.classList.remove('drag');if(moved>=28||moved<4){if(audio())noise(.12,5200,.25);setLit(!lit)}setPos(0);knob.classList.remove('swing');void knob.offsetWidth;knob.classList.add('swing')}
knob.addEventListener('pointerup',end);knob.addEventListener('pointercancel',end);
knob.addEventListener('keydown',e=>{if(['Enter',' ','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();audio();
 setLit(e.key==='ArrowDown'?true:e.key==='ArrowUp'?false:!lit)}});
setPos(0);

/* ---- ярлыки (сохраняются в браузере) ---- */
const KEY='serzhan-items';let DB={folder:[{name:'Дизайн PDF',url:'design.pdf'}],link:[{name:'Галактика сфер',url:'https://serzhanbirzhan.netlify.app/'},{name:'Moonfingg',url:'https://moonfingg.github.io/moonfings/'},{name:'Birzhan History',url:'https://moonfingg.github.io/birzhanhistory/'}],box:[]},cur='folder',links=DB.folder;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)DB=Object.assign(DB,s);if(!Array.isArray(DB.folder))DB.folder=[];if(!DB.folder.some(l=>l.url==='design.pdf'))DB.folder.push({name:'Дизайн PDF',url:'design.pdf'});if(!Array.isArray(DB.link))DB.link=[];if(!DB.link.some(l=>l.url==='https://moonfingg.github.io/moonfings/'))DB.link.push({name:'Moonfingg',url:'https://moonfingg.github.io/moonfings/'});if(!DB.link.some(l=>l.url==='https://moonfingg.github.io/birzhanhistory/'))DB.link.push({name:'Birzhan History',url:'https://moonfingg.github.io/birzhanhistory/'});links=DB[cur];save()}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const grads=['#f59e0b,#ef4444','#6366f1,#06b6d4','#10b981,#84cc16','#ec4899,#8b5cf6','#0ea5e9,#6366f1','#f97316,#facc15'];
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderLinks(){
 document.getElementById('tiles').innerHTML=links.map((l,i)=>`<a class="tile" style="--i:${i}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><b style="background:linear-gradient(135deg,${grads[i%grads.length]})">${esc(l.name.charAt(0).toUpperCase())}</b>${esc(l.name)}</a>`).join('');
 document.getElementById('dn').textContent=links.length?links.length+' шт.':'пока пусто';
 document.querySelectorAll('.v').forEach(v=>v.textContent=DB[v.dataset.k].length);if(!links.length)document.getElementById('tiles').insertAdjacentHTML('afterbegin','<div class="empty">Пока пусто</div>')}

 

 
 


let pending=null;
function openCat(k,t){pending={k,t};const c=document.getElementById('code');c.value='';c.classList.remove('bad');document.getElementById('mt').textContent=t;document.getElementById('lock').hidden=false;document.getElementById('view').hidden=true;document.getElementById('modal').classList.add('open');setTimeout(()=>c.focus(),350)}
function unlock(){cur=pending.k;links=DB[cur];document.getElementById('lock').hidden=true;document.getElementById('view').hidden=false;renderLinks()}
document.getElementById('code').addEventListener('input',e=>{const c=e.target;c.value=c.value.replace(/\D/g,'');if(c.value.length<4)return;
 if(c.value==='1028')unlock();else{c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');setTimeout(()=>{c.value='';c.classList.remove('bad')},500)}});
const cardsEl=document.getElementById('cards'),md=document.getElementById('modal');
cardsEl.addEventListener('click',e=>{const c=e.target.closest('.glass-card');if(c)openCat(c.dataset.k,c.dataset.t)});
cardsEl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.glass-card');if(c){e.preventDefault();openCat(c.dataset.k,c.dataset.t)}}});
function closeM(){md.classList.remove('open')}
document.getElementById('mx').addEventListener('click',closeM);
md.addEventListener('click',e=>{if(e.target===md)closeM()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
renderLinks();

/* ---- анимации ---- */


setInterval(()=>{const w=document.querySelector('.win-w');if(!w||!w.offsetWidth)return;const s=document.createElement('i');s.className='shoot';s.style.top=(5+Math.random()*30)+'%';w.appendChild(s);setTimeout(()=>s.remove(),1400)},6000);
let tx=0,ty=0,pxs=0,pys=0;addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
const cv=document.getElementById('dust'),cx=cv.getContext('2d');let P=[],fade=0;
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<70;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.5,vx:(Math.random()-.5)*.0002,vy:-Math.random()*.00025-.00005,ph:Math.random()*6});
function tick(t){if(playing){requestAnimationFrame(tick);return}pxs+=(tx-pxs)*.05;pys+=(ty-pys)*.05;if(Math.abs(tx-pxs)>.001||Math.abs(ty-pys)>.001){scene.style.setProperty('--px',pxs.toFixed(3));scene.style.setProperty('--py',pys.toFixed(3));placeTv();if(lit)place()}
cx.clearRect(0,0,cv.width,cv.height);fade+=((lit?1:0)-fade)*.04;
 if(fade>.01){const lx=parseFloat(scene.style.getPropertyValue('--lx'))||100,ly=parseFloat(scene.style.getPropertyValue('--ly'))||100;
  for(const p of P){p.x+=p.vx*16;p.y+=p.vy*16;if(p.y<0)p.y=1;if(p.x<0)p.x=1;if(p.x>1)p.x=0;
   const X=p.x*cv.width,Y=p.y*cv.height,a=Math.max(0,1-Math.hypot(X-lx,Y-ly)/(cv.height*.7))*(.5+.5*Math.sin(t/700+p.ph))*fade;
   if(a>.02){cx.fillStyle=`rgba(255,226,160,${a*.8})`;cx.beginPath();cx.arc(X,Y,p.r,0,6.3);cx.fill()}}}
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);

/* ---- время Астаны (UTC+5) ---- */
const atime=document.getElementById('atime'),hh=document.querySelector('.clock .h'),mm=document.querySelector('.clock .m'),ss=document.querySelector('.clock .s');
function clockTick(){const d=new Date(Date.now()+5*36e5),h=d.getUTCHours(),m=d.getUTCMinutes(),s=d.getUTCSeconds();
 hh.style.transform=`rotate(${(h%12)*30+m/2}deg)`;mm.style.transform=`rotate(${m*6+s/10}deg)`;ss.style.animation='none';ss.style.transform=`rotate(${s*6}deg)`;
 atime.textContent='Астана · '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
clockTick();setInterval(clockTick,1000);

/* ---- телевизор ---- */
const G=document.createElement('canvas');G.width=160;G.height=120;const g=G.getContext('2d');
const tvc=document.getElementById('tvc').getContext('2d'),crtc=document.getElementById('crtc'),crtx2=crtc.getContext('2d'),crt=document.getElementById('crt'),scr=document.getElementById('scr');
let tvOn=false,playing=false,crtOpen=false,glitchT=0,lastD=0,lastT=0,acc=0;tvc.imageSmoothingEnabled=false;
const S={x:80,lives:3,score:0,items:[],t:0,over:false,keys:{}};
function resetG(){S.x=80;S.lives=3;S.score=0;S.items=[];S.t=0;S.over=false}
function blip(f){if(ctx&&ctx.state==='running')tone(f,.09,.07,'square')}
function placeTv(){if(playing)return;const r=scr.getBoundingClientRect();scene.style.setProperty('--tx',(r.left+r.width/2)+'px');scene.style.setProperty('--ty',(r.top+r.height/2)+'px')}
addEventListener('resize',placeTv);placeTv();
function moth(x,y,t){g.fillStyle='#e8e1d0';const f=Math.floor(t/120)%2;g.fillRect(x-1,y,3,6);g.fillRect(x-6,y+1-f,5,4);g.fillRect(x+2,y+1-f,5,4);g.fillStyle='#ffd86b';g.fillRect(x-1,y-2,3,2)}
function drawIdle(t){g.fillStyle='#0c1424';g.fillRect(0,0,160,120);for(let i=0;i<30;i++){g.fillStyle=(i+Math.floor(t/400))%5?'#2b3a5e':'#9fb4e8';g.fillRect((i*47)%160,(i*29)%100,1,1)}
 moth(80,66+Math.sin(t/300)*3,t);g.textAlign='center';g.fillStyle='#e8e1d0';g.font='bold 14px monospace';g.fillText('МОТЫЛЁК',80,34);
 if(Math.floor(t/500)%2){g.font='8px monospace';g.fillStyle='#ffd86b';g.fillText('НАЖМИ НА ЭКРАН',80,104)}}
function stepGame(){if(S.over)return;S.t++;const k=S.keys;if(k.ArrowLeft||k.a)S.x-=2.2;if(k.ArrowRight||k.d)S.x+=2.2;S.x=Math.max(6,Math.min(154,S.x));
 if(S.t%Math.max(14,40-Math.floor(S.score/3))===0)S.items.push({x:8+Math.random()*144,y:-6,bad:Math.random()<.38,v:.8+Math.random()*.6+S.score/60});
 for(const it of S.items){it.y+=it.v;if(!it.d&&Math.abs(it.x-S.x)<7&&Math.abs(it.y-106)<7){it.d=1;if(it.bad){S.lives--;blip(110);if(S.lives<=0)S.over=true}else{S.score++;blip(660)}}}
 S.items=S.items.filter(i=>i.y<126&&!i.d)}
function drawGame(){g.fillStyle='#0b1220';g.fillRect(0,0,160,120);for(let i=0;i<24;i++){g.fillStyle='#26365a';g.fillRect((i*53)%160,(i*31+S.t*.2)%120|0,1,1)}
 for(const it of S.items){if(it.bad){g.fillStyle='#7a3fb0';g.fillRect(it.x-3,it.y-3,6,6);g.fillStyle='#ff5a5a';g.fillRect(it.x-2,it.y-1,1,1);g.fillRect(it.x+1,it.y-1,1,1)}else{g.fillStyle='#ffd86b';g.fillRect(it.x-1,it.y-2,2,5);g.fillRect(it.x-2,it.y-1,5,2)}}
 moth(S.x,104,S.t*16.7);g.fillStyle='#1c2a46';g.fillRect(0,113,160,7);g.font='8px monospace';g.fillStyle='#e8e1d0';g.textAlign='left';g.fillText('★'+S.score,4,10);g.textAlign='right';g.fillText('♥'.repeat(Math.max(0,S.lives)),156,10);
 if(S.over){g.textAlign='center';g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,40,160,40);g.fillStyle='#ff7a7a';g.font='bold 12px monospace';g.fillText('GAME OVER',80,58);g.font='8px monospace';g.fillStyle='#e8e1d0';g.fillText('ТАП — ЕЩЁ РАЗ',80,72)}}
const R=document.createElement('canvas');R.width=320;R.height=240;const r=R.getContext('2d');
const N=document.createElement('canvas');N.width=160;N.height=120;{const n=N.getContext('2d'),im=n.createImageData(160,120);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}n.putImageData(im,0,0)}
const HS=Array.from({length:90},(_,i)=>({a:(i/90-.5)*2.4+Math.sin(i*7.3)*.12,l:50+(Math.sin(i*12.9)+1)*34,w:.8+(i%3)*.5,s:i*.7}));
function strands(x,y,t){r.lineCap='round';for(const h of HS){const sw=Math.sin(t/500+h.s)*4;r.strokeStyle=h.s%3<1?'rgba(75,88,86,.5)':'#030404';r.lineWidth=h.w*1.7;r.beginPath();r.moveTo(x+h.a*12,y);r.quadraticCurveTo(x+h.a*32+sw*.4,y+h.l*.5,x+h.a*38+sw,y+h.l*1.5);r.stroke()}}
function drawRing(p,now){const q=Math.floor(p*16)/16;
 const gr=r.createRadialGradient(160,150,10,160,140,210);gr.addColorStop(0,'#2d4d46');gr.addColorStop(.5,'#10211f');gr.addColorStop(1,'#020605');r.globalAlpha=1;r.globalCompositeOperation='source-over';r.fillStyle=gr;r.fillRect(0,0,320,240);
 r.fillStyle='rgba(0,0,0,.45)';for(let i=0;i<6;i++)r.fillRect(20+i*55,0,6+i%3*4,150);
 r.fillStyle='#030606';r.beginPath();r.ellipse(160,196,66,20,0,0,7);r.fill();
 const rim=(a0,a1)=>{r.lineWidth=9;r.strokeStyle='#4d625c';r.beginPath();r.ellipse(160,196,70,23,0,a0,a1);r.stroke();r.lineWidth=2;r.strokeStyle='#1a2623';for(let i=0;i<16;i++){const a=i/16*6.283;if(a<a0||a>a1)continue;r.beginPath();r.moveTo(160+Math.cos(a)*65,196+Math.sin(a)*21);r.lineTo(160+Math.cos(a)*76,196+Math.sin(a)*25);r.stroke()}};
 rim(0,6.283);
 if(q>.2){const rise=Math.min(1,(q-.2)/.5),out=Math.max(0,(q-.7)/.3),sc=1+out*2.6;
  r.save();r.translate(160+Math.sin(now/90)*(q>.8?2:.6),206-rise*46+out*120);r.scale(sc,sc);
  r.fillStyle='rgba(224,234,228,.85)';r.beginPath();r.moveTo(-17,0);r.lineTo(-22,-56);r.lineTo(22,-56);r.lineTo(17,0);r.closePath();r.fill();
  r.strokeStyle='rgba(90,100,96,.4)';r.lineWidth=1.2;r.beginPath();r.moveTo(-8,-52);r.lineTo(-10,-2);r.moveTo(6,-50);r.lineTo(8,-4);r.stroke();
  r.fillStyle='#050606';r.beginPath();r.ellipse(0,-72,15,19,0,0,7);r.fill();strands(0,-88,now);
  if(q>.72&&Math.random()<.85){r.fillStyle='rgba(228,235,230,.85)';r.fillRect(-2,-74,4,12);r.fillStyle='#fff';r.beginPath();r.ellipse(1,-70,3.2,2.2,0,0,7);r.fill();r.fillStyle='#000';r.beginPath();r.arc(1.2,-70,1.2,0,7);r.fill()}
  const arm=s=>{const ex=s*(34+out*18),ey=-8+out*22;r.strokeStyle='#cfd8d3';r.lineWidth=7;r.beginPath();r.moveTo(s*20,-46);r.quadraticCurveTo(s*(38+out*10),-30,ex,ey);r.stroke();r.lineWidth=1.6;for(let f=0;f<5;f++){r.beginPath();r.moveTo(ex,ey);r.lineTo(ex+(f-2)*3.4,ey+7-Math.abs(f-2));r.stroke()}};arm(-1);arm(1);
  r.restore();if(q<.85)rim(0,3.1416)}
 r.globalCompositeOperation='lighter';r.globalAlpha=.2;r.drawImage(N,Math.random()*-40,Math.random()*-30,360,270);r.globalAlpha=1;r.globalCompositeOperation='source-over';
 for(let i=0;i<3;i++)if(Math.random()<.6){const y=Math.random()*220|0;r.drawImage(R,0,y,320,6+(Math.random()*12|0),(Math.random()*24-12)|0,y,320,10)}
 if(Math.random()<.05){r.fillStyle='rgba(200,255,235,.45)';r.fillRect(0,0,320,240)}}
 
 
 
 
function endGlitch(){glitchT=0;scene.classList.remove('glitch')}
function tvFrame(now){if(glitchT&&(lit||tvOn||now-glitchT>7000))endGlitch();
 if(glitchT){if(now-lastD<33)return;lastD=now;drawRing((now-glitchT)/7000,now);tvc.drawImage(R,0,0);return}
 if(!tvOn)return;
 if(crtOpen){acc=Math.min(100,acc+now-lastT);lastT=now;while(acc>=16.7){stepGame();acc-=16.7}drawGame();crtx2.drawImage(G,0,0);return}
 lastT=now;if(now-lastD<33)return;lastD=now;drawIdle(now);tvc.drawImage(G,0,0,320,240);return;
 }
function tvLoop(t){tvFrame(t);requestAnimationFrame(tvLoop)}requestAnimationFrame(tvLoop);
setInterval(()=>{if(!lit&&!tvOn&&!playing&&!glitchT){glitchT=performance.now();scene.classList.add('glitch');if(ctx)noise(.5,1800,.12)}},25000);
function setTv(v){tvOn=v;scene.classList.toggle('tvon',v);if(v)endGlitch();if(audio())noise(.15,900,.3)}
const pw=document.getElementById('pw');
pw.addEventListener('click',e=>{e.stopPropagation();audio();setTv(!tvOn)});
pw.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();audio();setTv(!tvOn)}});
function steps(){[0,300,600,900,1200].forEach(d=>setTimeout(()=>{if(ctx&&ctx.state==='running')tone(70,.12,.15)},d))}
scr.addEventListener('click',()=>{if(!tvOn||playing)return;playing=true;audio();const r=scr.getBoundingClientRect();
 scene.style.setProperty('--ox',(r.left+r.width/2)+'px');scene.style.setProperty('--oy',(r.top+r.height/2)+'px');closeM();scene.classList.add('up','walk');steps();
 setTimeout(()=>{resetG();lastT=performance.now();acc=0;crtOpen=true;crt.classList.add('show');setTimeout(()=>scene.classList.add('hid'),600)},1700)});
function exitTv(){if(!crtOpen)return;crtOpen=false;scene.classList.remove('hid');crt.classList.remove('show');
 setTimeout(()=>{scene.classList.remove('walk');void scene.offsetWidth;scene.classList.add('walkb');scene.classList.remove('up');steps();setTimeout(()=>{scene.classList.remove('walkb');playing=false;placeTv()},1650)},450)}
document.getElementById('crtx').addEventListener('click',exitTv);
addEventListener('keydown',e=>{if(e.key==='Escape')exitTv();if(crtOpen){S.keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()}});
addEventListener('keyup',e=>{S.keys[e.key]=false});
crtc.addEventListener('pointermove',e=>{const r=crtc.getBoundingClientRect();S.x=Math.max(6,Math.min(154,(e.clientX-r.left)/r.width*160))});
crtc.addEventListener('pointerdown',e=>{const r=crtc.getBoundingClientRect();S.x=(e.clientX-r.left)/r.width*160;if(S.over)resetG()});
