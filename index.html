<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Халықтардың Қазақстанға депортациялануы</title>
    <meta name="description" content="Халықтардың Қазақстанға депортациялануы тақырыбындағы интерактивті тарихи презентация. Авторы: Сержан Біржан, тобы: APE2601." />
    <meta property="og:title" content="Халықтардың Қазақстанға депортациялануы" />
    <meta property="og:description" content="Халықтардың Қазақстанға депортациялануы тақырыбындағы интерактивті тарихи презентация. Авторы: Сержан Біржан, тобы: APE2601." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Негізгі презентация контейнері -->
    <div class="presentation-wrapper" id="app-wrapper">
      
      <!-- Фондық бөлшектер холсты (қар, дала шаңы, жұлдыздар) -->
      <canvas id="canvas-particles"></canvas>
      <div class="vignette-overlay"></div>

      <!-- ВСТУПИТЕЛЬНЫЙ ЭКРАН (ИНТРО) -->
      <section class="intro-screen" id="intro-screen" aria-label="Кіріспе экран">
        <div class="intro-content">
          <div class="intro-badge">Тарихи зерттеу жұмысы</div>
          <h1 class="intro-title">Халықтардың Қазақстанға депортациялануы</h1>
          
          <div class="intro-meta">
            <div class="intro-author">Сержан Біржан</div>
            <div class="intro-group">Топ: APE2601</div>
          </div>

          <button id="btn-start" class="btn-start" type="button">
            Бастау
          </button>
          
          <div class="intro-hint">Дыбысты іске қосу және презентацияны бастау үшін басыңыз</div>
        </div>
      </section>

      <!-- ЖОҒАРҒЫ ҚҰРАЛДАР ПАНЕЛІ -->
      <header class="top-bar">
        <div class="top-brand">
          <span class="brand-title">Халықтардың депортациялануы</span>
          <span class="brand-subtitle">Сержан Біржан, APE2601</span>
        </div>

        <div class="top-controls">
          <!-- Дыбыс басқару виджеті -->
          <div class="audio-widget" title="Дыбысты реттеу">
            <button id="btn-audio-toggle" class="control-btn" type="button" aria-label="Дыбысты қосу немесе өшіру">
              <svg viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            </button>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.65" aria-label="Дыбыс қаттылығы" />
          </div>

          <!-- Толық экран батырмасы -->
          <button id="btn-fullscreen" class="control-btn" type="button" aria-label="Толық экран режимі" title="Толық экран">
            <svg viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
          </button>

          <!-- Слайд санағышы -->
          <div id="slide-counter-badge" class="slide-counter-badge">01 / 09</div>
        </div>
      </header>

      <!-- ОРТАЛЫҚ СЛАЙДТАР ОРНЫ -->
      <main class="main-stage">
        <div class="slide-viewport" id="slide-viewport">
          <!-- Слайдтар script.js арқылы салынады -->
        </div>
      </main>

      <!-- ТӨМЕНГІ НАВИГАЦИЯ ПАНЕЛІ -->
      <footer class="bottom-dock">
        <div class="nav-buttons-cluster">
          <button id="btn-prev" class="nav-btn" type="button" aria-label="Алдыңғы слайдқа өту">
            <svg viewBox="0 0 24 24">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
            <span>Артқа</span>
          </button>

          <button id="btn-next" class="nav-btn" type="button" aria-label="Келесі слайдқа өту">
            <span>Алға</span>
            <svg viewBox="0 0 24 24">
              <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
          </button>
        </div>

        <!-- Төменгі прогресс нүктелері -->
        <nav class="progress-dots" id="progress-dots" aria-label="Слайдтар бойынша өту"></nav>

        <!-- Пернетақта көмекшісі -->
        <div class="keyboard-hint">
          Басқару: <span class="kbd-badge">←</span> <span class="kbd-badge">→</span> немесе свайп
        </div>
      </footer>

      <!-- ОРТАҚ SVG СХЕМАТИКАЛЫҚ КАРТА (ЖАСЫРЫН ҮЛГІ) -->
      <div id="schematic-map-container" class="map-stage" style="display: none;">
        <svg id="schematic-map-svg" class="map-svg" viewBox="0 0 800 500">
          <defs>
            <!-- Карта торының үлгісі -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(201, 157, 66, 0.05)" stroke-width="1" />
            </pattern>
            
            <!-- Жарқыл фильтрі -->
            <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Фондық координаталық тор -->
          <rect width="100%" height="100%" fill="url(#grid)" />

          <!-- КСРО мен көрші аймақтардың сұлбалық контуры -->
          <g class="map-boundaries">
            <!-- Ресей мен Сібір кеңістігі -->
            <path class="map-land" d="M 120,180 Q 280,120 480,110 T 780,180 L 770,360 Q 640,320 540,340 L 520,380 L 360,400 L 220,380 L 140,320 Z" />
            
            <!-- Солтүстік мұхит пен теңіздер бағыты -->
            <line x1="80" y1="140" x2="780" y2="140" class="map-grid-line" />
            <line x1="80" y1="260" x2="780" y2="260" class="map-grid-line" />
            <line x1="80" y1="380" x2="780" y2="380" class="map-grid-line" />

            <!-- Қазақстан территориясының ерекшеленген сұлбасы -->
            <!-- Орталық нүктесі шамамен (430, 310) -->
            <path class="map-kazakhstan" id="map-kazakhstan-polygon" d="M 330,280 L 390,260 L 460,250 L 520,280 L 550,330 L 510,380 L 440,390 L 380,380 L 330,360 L 310,320 Z" />
            <text x="430" y="325" fill="#e6c575" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle" filter="url(#glow-gold)">ҚАЗАҚСТАН</text>
            <text x="430" y="342" fill="#baa996" font-size="10" text-anchor="middle">Депортация орны</text>
          </g>

          <!-- Қазақстан орталығындағы қабылдау нүктесі -->
          <circle cx="430" cy="310" r="5" class="city-marker destination" />
          <circle cx="430" cy="310" r="14" fill="none" stroke="#e6c575" stroke-width="1.2" class="city-pulse" />

          <!-- Бағыт сызығы (артқы көмекші) -->
          <path id="bg-route-path" class="route-path-bg" d="" />
          <!-- Белсенді жарқыраған бағыт траекториясы -->
          <path id="active-route-path" class="route-path-active" d="" />

          <!-- Бастапқы қала нүктесі мен атауы -->
          <circle id="origin-city-pulse" cx="0" cy="0" r="12" fill="none" stroke="#e6c575" stroke-width="1.2" class="city-pulse" style="display: none;" />
          <circle id="origin-city-marker" cx="0" cy="0" r="4" class="city-marker" style="display: none;" />
          <text id="origin-city-label" x="0" y="0" class="city-label" text-anchor="middle"></text>

          <!-- Маршрут бойымен қозғалатын шағын пойыз белгісі -->
          <g id="train-symbol" class="train-node" style="display: none;">
            <!-- Түтін бұлты -->
            <circle cx="-16" cy="-6" r="3" class="train-smoke" />
            <circle cx="-22" cy="-9" r="4" class="train-smoke" />
            <!-- Локомотив корпусы -->
            <rect x="-14" y="-7" width="28" height="14" rx="2" class="train-wagon" />
            <!-- Терезелер -->
            <rect x="-10" y="-5" width="5" height="5" fill="#120e0b" />
            <rect x="-2" y="-5" width="5" height="5" fill="#120e0b" />
            <rect x="6" y="-5" width="5" height="5" fill="#120e0b" />
            <!-- Дөңгелектер -->
            <circle cx="-8" cy="8" r="2.5" class="train-wheel" />
            <circle cx="0" cy="8" r="2.5" class="train-wheel" />
            <circle cx="8" cy="8" r="2.5" class="train-wheel" />
            <!-- Алдыңғы шамның жарық сәулесі -->
            <polygon points="14,-2 26,-6 26,6 14,2" fill="rgba(245, 240, 230, 0.4)" />
          </g>
        </svg>
      </div>

    </div>

    <!-- Презентация скрипті -->
    <script src="./script.js"></script>
  </body>
</html>
